  {d:"Total objects (cluster)",safe:"≤ 2M",caution:"2M–3M → monitor",ceiling:"~5M HA Sky hard limit",note:"ELMO at 3M stable; Submittable + formulas → OOM"},
  {d:"Customer Orgs per cluster",safe:"< 200 heavy Orgs",caution:"200–1K → architect review",ceiling:"> 5K → Tenant Fleet",note:"Submittable: 1,500 Orgs + formulas → Red account"},
  {d:"Custom columns per Org",safe:"< 100",caution:"100–500 → load test",ceiling:"> 500 → architect review",note:"Submittable: 10K columns → Sage OOM"},
  {d:"SQL / JSON formulas per Org",safe:"< 50",caution:"50–100 → review",ceiling:"> 100 → OOM risk",note:"ClearCo + Submittable formula combinations"},
  {d:"Async TML import frequency",safe:"Weekly or less",caution:"Daily → thread-pool tuning",ceiling:"Bulk without pre-validation → OOM",note:"ClearCo May 13/15, Submittable May 22-26"},

const QUESTIONS = [

// ─── Recipe proximity scoring ──────────────────────────────────────────────
// Each base recipe accrues points from how well the captured answers match its
// shape. Scores are normalised against the top scorer so the result reads as a
// spread ("mostly R2, partly R3") rather than a single hard winner — because no
// real customer lands cleanly in one recipe. Co-pilot (R6) and Vault (R7) are
// layers/postures scored separately and surfaced as add-ons.
const BASE_RECIPES=["reporter","tenantMesh","tenantTemplates","workbench","tenantFleet"];
// Normalise any answer to an array (multi-select questions store arrays; others store a string).
const asArr=v=>Array.isArray(v)?v:(v==null||v===""?[]:[v]);
function scoreRecipes(ans){
  const {tenants,objects,model}=ans;
  const surfaces=asArr(ans.surface), isolations=asArr(ans.isolation);
  const s={reporter:0,tenantMesh:0,tenantTemplates:0,workbench:0,tenantFleet:0,copilot:0,vault:0};
  // Tenant count is the strongest signal
  if(tenants==="internal"){s.reporter+=4; s.workbench+=3;}
  if(tenants==="small"){s.reporter+=3; s.tenantMesh+=2; s.tenantTemplates+=2;}
  if(tenants==="mid"){s.tenantMesh+=4; s.tenantTemplates+=3; s.tenantFleet+=1;}
  if(tenants==="large"){s.tenantFleet+=6; s.tenantMesh+=1;}
  // Object volume
  if(objects==="low"){s.reporter+=2; s.tenantMesh+=2; s.workbench+=1;}
  if(objects==="mid"){s.tenantMesh+=2; s.tenantTemplates+=2;}
  if(objects==="high"){s.tenantTemplates+=2; s.tenantFleet+=2;}
  if(objects==="critical"){s.tenantFleet+=6;}
  // Embed surface (multi-select — points accrue for each chosen surface)
  surfaces.forEach(surface=>{
    if(surface==="liveboard"){s.reporter+=2; s.tenantMesh+=2;}
    if(surface==="fullapp"){s.workbench+=4;}
    if(surface==="search"){s.workbench+=2; s.tenantMesh+=1;}
    if(surface==="spotter"){s.copilot+=6; s.tenantMesh+=1;}
  });
  // Model standardisation
  if(model==="identical"){s.reporter+=2; s.tenantMesh+=3;}
  if(model==="parameterized"){s.tenantTemplates+=5;}
  if(model==="bespoke"){s.tenantFleet+=3; s.tenantTemplates+=1;}
  // Isolation posture (multi-select)
  isolations.forEach(isolation=>{
    if(isolation==="shared"){s.reporter+=3; s.tenantMesh+=1;}
    if(isolation==="colLevel"){s.workbench+=2; s.tenantMesh+=1; s.vault+=2;}
    if(isolation==="orgLevel"){s.tenantMesh+=3; s.tenantTemplates+=2; s.vault+=3;}
  });
  return s;
}
function derive(ans) {
  const {tenants,objects,model}=ans;
  const surfaces=asArr(ans.surface);
  const scores=scoreRecipes(ans);
  const flags=[];
  if(objects==="critical")flags.push({level:"critical",q:"Object Count",text:"Object ceiling exceeded — multi-instance required.",detail:"Beyond single-instance capacity at this object volume. Multi-instance Tenant Fleet from Day 0.",sa:true});
  if(model==="bespoke")flags.push({level:"warn",q:"Model Complexity",text:"Bespoke models per customer — object multiplication risk.",detail:"Each customer with a unique data model means N separate copies of schemas and formulas. At 200+ customers this can quickly exceed safe object counts.",sa:true});
  // Rank base recipes
  const ranked=BASE_RECIPES
    .map(k=>({k,score:scores[k]}))
    .sort((a,b)=>b.score-a.score);
  // Hard rules: the tool's own scale logic REQUIRES Tenant Fleet in these cases,
  // regardless of how other dimensions score (>5K customers or >5M objects = multi-instance).
  let base=ranked[0].k;
  if(objects==="critical"||tenants==="large")base="tenantFleet";
  const topScore=ranked[0].score||1;
  // Normalised landscape (all 7), 0–100 relative to top base scorer
  const landscape=["reporter","tenantMesh","tenantTemplates","workbench","tenantFleet","copilot","vault"]
    .map(k=>({k,pct:Math.round((scores[k]/topScore)*100)}))
    .sort((a,b)=>b.pct-a.pct);
  // Add-ons: layers that score meaningfully
  const addons=[];
  if(scores.copilot>=topScore*0.5||surfaces.includes("spotter"))addons.push("copilot");
  if(scores.vault>=topScore*0.6)addons.push("vault");
  // Deviations: non-winning BASE recipes that still pull hard (>=35% of top)
  const deviations=ranked.slice(1).filter(r=>r.pct>=35||(r.score/topScore)>=0.35)
    .map(r=>r.k);
  const devList=ranked.slice(1).filter(r=>(r.score/topScore)>=0.35).map(r=>r.k);
  // Off-recipe: the customer needs something beyond the seven, OR no base fits well
  const offRecipe=[];
  if(tenants==="large"&&model==="bespoke")offRecipe.push("Very high tenant count with bespoke models exceeds the productised Tenant Fleet envelope — architect-designed pattern likely needed");
  const weakFit=topScore<6;// nothing scored convincingly
  if(weakFit)offRecipe.push("No single recipe is a strong match — this is a blended or custom architecture requiring solutions-architect design");
  return {base,addons,flags,landscape,deviations:devList,offRecipe,scores,topScore};
}
// ─── Validation harness ─────────────────────────────────────────────────────
// Labeled cases used to check the scorer against known-correct recipes.
// Seed = one representative profile per recipe (named after real reference
// customers). Add confirmed real sessions here over time to harden accuracy.
// `expectAddon` checks a layer; `knownGap` marks a documented limitation that
// is not counted as a failure (see the Vault case — no question yet captures a
// regulatory/compliance mandate, so R7 cannot be auto-detected today).
const VALIDATION_CASES=[
  {label:"Internal single-tenant reporting",ref:"IBM · Sephora · Chick-fil-A",expect:"reporter",
    answers:{tenants:"internal",objects:"low",surface:"liveboard",model:"identical",isolation:"shared"}},
  {label:"Small external, shared data (RLS)",ref:"Hartford · Cetera",expect:"reporter",
    answers:{tenants:"small",objects:"low",surface:"liveboard",model:"identical",isolation:"shared"}},
  {label:"Mid tenant count, Org-isolated",ref:"Hyatt · Wex · JUST EAT",expect:"tenantMesh",
    answers:{tenants:"mid",objects:"mid",surface:"liveboard",model:"identical",isolation:"orgLevel"}},
  {label:"Templated content, own DB per customer",ref:"ELMO · Abrigo · ClearCompany",expect:"tenantTemplates",
    answers:{tenants:"mid",objects:"high",surface:"liveboard",model:"parameterized",isolation:"orgLevel"}},
  {label:"Internal full-app analytics portal",ref:"Guidewire · BD · Northern Trust",expect:"workbench",
    answers:{tenants:"internal",objects:"mid",surface:"fullapp",model:"identical",isolation:"colLevel"}},
  {label:">5K customers — multi-instance",ref:"Verisk · GBT",expect:"tenantFleet",
    answers:{tenants:"large",objects:"high",surface:"liveboard",model:"identical",isolation:"orgLevel"}},
  {label:"Object ceiling exceeded (>5M)",ref:"Submittable-scale",expect:"tenantFleet",
    answers:{tenants:"mid",objects:"critical",surface:"liveboard",model:"bespoke",isolation:"orgLevel"}},
  {label:"Spotter AI on a Tenant Mesh base",ref:"Motive (prod)",expect:"tenantMesh",expectAddon:"copilot",
    answers:{tenants:"mid",objects:"mid",surface:"spotter",model:"identical",isolation:"orgLevel"}},
  {label:"Regulated / physical isolation",ref:"JPMorgan",expect:"tenantMesh",expectAddon:"vault",knownGap:true,
    gapNote:"No question yet captures a regulatory/compliance mandate, so Vault (R7) cannot be auto-detected. Add a compliance question to close this gap.",
    answers:{tenants:"mid",objects:"mid",surface:"liveboard",model:"identical",isolation:"orgLevel"}},
];
function runValidation(){
  return VALIDATION_CASES.map(c=>{
    const r=derive(c.answers);
    const baseOk=r.base===c.expect;
    const addonOk=!c.expectAddon||r.addons.includes(c.expectAddon);
    const pass=baseOk&&addonOk;
    return {...c,gotBase:r.base,gotAddons:r.addons,baseOk,addonOk,pass};
  });
}

        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:16}}>{crit?"🚨":"⚠️"}</span>

            <div style={{fontSize:13,fontWeight:700,color:crit?"#DC2626":"#92400E"}}>{flag.text}</div>
          </div>
        </div>
        <span style={{fontSize:11,color:C.muted,flexShrink:0,marginLeft:8}}>{expanded?"▲":"▼ why"}</span>

      {expanded&&<div style={{background:"white",padding:"12px 16px",fontSize:13,color:"#374151",lineHeight:1.6,borderTop:"1px solid #FEE2E2"}}>{flag.detail}</div>}
    </div>

}

// ─── Main App ─────────────────────────────────────────────────────────────
function App(){
  const[screen,setScreen]=React.useState("intro");
  const[tab,setTab]=React.useState("start");
  const[step,setStep]=React.useState(0);
  const[answers,setAnswers]=React.useState({});
  const[session,setSession]=React.useState({name:"",company:"",date:new Date().toISOString().split("T")[0],useCase:"",useCaseTags:[],subUseCases:[],priorState:"",priorTool:"",confirmedBase:"",saNotes:""});
  const[expandedFlags,setExpandedFlags]=React.useState({});
  const[hovered,setHovered]=React.useState(null);
  const[saving,setSaving]=React.useState(false);
  const[saveStatus,setSaveStatus]=React.useState(null);// null | "success" | "error"
  const[savedSessions,setSavedSessions]=React.useState([]);
  const[resumeMsg,setResumeMsg]=React.useState("");
  const[resumeOpen,setResumeOpen]=React.useState(false);
  const[resumePage,setResumePage]=React.useState(0);
  const blankSession=()=>({name:"",company:"",date:new Date().toISOString().split("T")[0],useCase:"",useCaseTags:[],subUseCases:[],priorState:"",priorTool:"",confirmedBase:"",saNotes:""});
  const totalQ=QUESTIONS.length;
  const curQ=screen==="q"?QUESTIONS[step]:null;
  const hasAns=q=>{const a=answers[q.id];return Array.isArray(a)?a.length>0:!!a;};
  const answeredSoFar=QUESTIONS.filter(hasAns);
  const answerLabel=q=>asArr(answers[q.id]).map(v=>q.options.find(o=>o.v===v)?.l).filter(Boolean).join(" + ");
  const rec=screen==="result"?derive(answers):null;
  // ── Resumable session persistence (server-side, keyed by name+company) ──
  const sessionId=(s)=>`${(s.name||"").trim().toLowerCase()}__${(s.company||"").trim().toLowerCase()}`;
  async function persistSession(over={}){
    const snap={screen,step,answers,session,...over};
    if(!snap.session.name.trim()||!snap.session.company.trim())return;// need a key
    const id=sessionId(snap.session);
    const state={id,label:`${snap.session.company} · ${snap.session.name}`,

      session.priorState==="netnew"?"Net-new":session.priorState==="replacing"?"Replacing tool":"",

  function RadarChart({vals}){
    const cx=135,cy=135,maxR=90,n=RADAR_DIMS.length;
    function ang(i){return(i*2*Math.PI/n)-Math.PI/2;}
    function pt(i,v){const r=(v/5)*maxR,a=ang(i);return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
    function labelPt(i){const r=maxR+26,a=ang(i);return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
    const gridRings=[1,2,3,4,5].map(lv=>{
      const pts=RADAR_DIMS.map((_,i)=>{const r=(lv/5)*maxR,a=ang(i);return`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`;}).join(' ');
      return <polygon key={lv} points={pts} fill="none" stroke={lv===5?"#CBD5E1":"#E2E8F0"} strokeWidth={lv===5?1.5:1}/>;
    });
    const dataPolygon=vals.map((v,i)=>pt(i,v)).map(p=>`${p.x},${p.y}`).join(' ');
    const totalScore=vals.reduce((a,b)=>a+b,0);
    const pct=Math.round((totalScore/25)*100);
    const scoreColor=pct<45?"#10B981":pct<70?"#F59E0B":"#EF4444";
    const scoreLabel=pct<45?"Low complexity":pct<70?"Moderate":"High complexity";
    return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
        <svg width="270" height="270" viewBox="0 0 270 270">
          {gridRings}
          {RADAR_DIMS.map((_,i)=>{const e=pt(i,5);return <line key={i} x1={cx} y1={cy} x2={e.x} y2={e.y} stroke="#E2E8F0" strokeWidth="1"/>;})}
          <polygon points={dataPolygon} fill="rgba(99,102,241,0.18)" stroke="#6366F1" strokeWidth="2.5" strokeLinejoin="round"/>
          {vals.map((v,i)=>{const p=pt(i,v);return <circle key={i} cx={p.x} cy={p.y} r="4.5" fill="#6366F1" stroke="white" strokeWidth="1.5"/>;})}
          {RADAR_DIMS.map((d,i)=>{const l=labelPt(i);const anchor=l.x<cx-5?"end":l.x>cx+5?"start":"middle";return(
            <text key={i} x={l.x} y={l.y} textAnchor={anchor} fontSize="9.5" fill="#64748B" fontWeight="600" dominantBaseline="middle">{d.label}</text>
          );})}
        </svg>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:-8}}>
          <div style={{width:36,height:36,borderRadius:"50%",background:scoreColor+"22",border:`2.5px solid ${scoreColor}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:scoreColor}}>{pct<45?"🟢":pct<70?"🟡":"🔴"}</div>

            <div style={{fontSize:11,color:C.muted}}>{pct<45?"Within normal tested parameters":pct<70?"A few items to validate before go-live":"Architect sign-off required"}</div>
          </div>
        </div>
      </div>
    );

        </div>
        <div style={{background:"white",padding:"16px 20px"}}>
          <p style={{fontSize:13,color:"#374151",lineHeight:1.6,margin:"0 0 14px"}}>{plain.summary}</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            {[["TENANCY",r.tenancy],["AUTH",r.auth],["SECURITY",r.security],["DEPLOYMENT",r.deploy]].map(([l,v])=>(
              <div key={l} style={{background:"#F8FAFC",borderRadius:8,padding:"8px 12px"}}>
                <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:"0.5px",marginBottom:3}}>{l}</div>
                <div style={{fontSize:12,color:C.slate,fontWeight:600,lineHeight:1.3}}>{v}</div>
              </div>
            ))}
          </div>
          <div style={{background:"#F8FAFC",borderRadius:8,padding:"8px 12px",marginBottom:16}}>
            <span style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:"0.5px"}}>SCALE CEILING  </span>
            <span style={{fontSize:12,color:C.slate,fontWeight:600}}>{r.ceiling}</span>
          </div>
          <div style={{fontSize:10,fontWeight:800,color:r.color,letterSpacing:"0.6px",marginBottom:10}}>SOLUTIONS &amp; COMPONENTS</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            {plain.components.map((comp,i)=>(
              <div key={i} style={{background:"#FBFCFE",border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",display:"flex",gap:10,alignItems:"flex-start"}}>
                <span style={{fontSize:20,flexShrink:0}}>{comp.i}</span>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:C.slate,marginBottom:3,lineHeight:1.3}}>{comp.n}</div>
                  <div style={{fontSize:12,color:C.muted,lineHeight:1.45}}>{comp.d}</div>
                </div>
              </div>
            ))}
          </div>
          <div style={{fontSize:11,color:C.muted}}><strong style={{color:C.slate}}>Reference customers: </strong>{r.examples.join("  ·  ")}</div>
        </div>
      </div>
    );
  }
  // ── Result screen ─────────────────────────────────────────────────────────
  if(screen==="result"&&rec){
    const plain={...PLAIN[rec.base]};
    return(
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}}>
        <Header/>
        <div style={{maxWidth:960,margin:"0 auto",padding:"24px",width:"100%"}}>
          {/* Hero */}
          <div style={{background:`linear-gradient(135deg,${RECIPES[rec.base].color}18,${RECIPES[rec.base].color}08)`,border:`2px solid ${RECIPES[rec.base].color}44`,borderRadius:18,padding:"22px 28px",marginBottom:20,display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:280}}>
              <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"1.2px",marginBottom:6}}>RECOMMENDED SETUP FOR {session.company.toUpperCase()}</div>
              <div style={{fontSize:26,fontWeight:800,color:C.navy,lineHeight:1.2,marginBottom:8}}>{plain.headline}</div>
              <p style={{fontSize:14,color:C.slate,lineHeight:1.6,maxWidth:580,margin:"0 0 14px"}}>{plain.summary}</p>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                <span style={{background:RECIPES[rec.base].color,color:"white",fontSize:12,fontWeight:700,padding:"5px 12px",borderRadius:999}}>{RECIPES[rec.base].code} · {RECIPES[rec.base].name}</span>
                {rec.addons.map(a=>(
                  <span key={a} style={{background:"white",border:`1.5px solid ${RECIPES[a].color}`,color:RECIPES[a].color,fontSize:12,fontWeight:700,padding:"4px 11px",borderRadius:999}}>+ {RECIPES[a].code} · {RECIPES[a].name}</span>
                ))}
              </div>
            </div>
            <div style={{fontSize:52}}>{RECIPES[rec.base].icon}</div>
          </div>
          {/* Prescribed recipe(s) — only the recommended base + any add-on layer, each with its own solutions */}
          <div style={{marginBottom:20}}>
            <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"1px",marginBottom:4}}>PRESCRIBED RECIPE{rec.addons.length>0?"S":""} FOR {session.company.toUpperCase()}</div>
            <p style={{fontSize:12,color:C.muted,margin:"0 0 16px",lineHeight:1.5}}>{rec.addons.length>0?"The recommended base recipe and the layer(s) on top of it":"The recommended deployment recipe"}, each shown with the specific ThoughtSpot solutions it uses.</p>
            <PrescribedRecipeCard rk={rec.base} plain={PLAIN[rec.base]} addon={false}/>
            {rec.addons.map(a=>(
              <PrescribedRecipeCard key={a} rk={a} plain={PLAIN[a]} addon={true}/>
            ))}
            {rec.offRecipe.length>0&&(
              <div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,padding:"12px 16px"}}>
                <div style={{fontSize:11,fontWeight:800,color:"#B45309",letterSpacing:"0.5px",marginBottom:6,display:"flex",alignItems:"center",gap:6}}>
                  <span>⚑</span> BEYOND THE PRESCRIBED RECIPES
                </div>
                {rec.offRecipe.map((o,i)=>(
                  <div key={i} style={{fontSize:12,color:"#92400E",lineHeight:1.5,marginBottom:i<rec.offRecipe.length-1?5:0}}>• {o}</div>
                ))}
                <div style={{fontSize:11,color:"#B45309",marginTop:7,fontStyle:"italic"}}>Off-recipe elements require solutions-architect design and sign-off.</div>
              </div>
            )}
          </div>
          {/* Flags — only if present */}
          {rec.flags.length>0&&(
            <div style={{background:"white",border:`1px solid ${C.border}`,borderRadius:14,padding:"18px 20px",marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:700,color:"#DC2626",letterSpacing:"1px",marginBottom:12}}>⚠ ITEMS TO REVIEW BEFORE GO-LIVE</div>
              {rec.flags.map((f,i)=>(
                <FlagCard key={i} flag={f} expanded={!!expandedFlags[i]} onToggle={()=>setExpandedFlags(p=>({...p,[i]:!p[i]}))}/>
              ))}
            </div>
          )}
          {/* Bottom row: summary + save */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
            <div style={{background:"white",border:`1px solid ${C.border}`,borderRadius:14,padding:"18px 20px"}}>
              <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"1px",marginBottom:12}}>DISCOVERY SUMMARY</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:12}}>{session.company} · {session.name} · {session.date}</div>
              {session.useCase&&(
                <div style={{background:"#F8FAFC",borderRadius:8,padding:"10px 12px",marginBottom:10}}>
                  <div style={{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.5px",marginBottom:4}}>USE CASE</div>
                  <div style={{fontSize:12,color:C.slate,lineHeight:1.5}}>{session.useCase}</div>
                  {session.useCaseTags.length>0&&<div style={{marginTop:6,display:"flex",flexWrap:"wrap",gap:4}}>{session.useCaseTags.map(t=><span key={t} style={{fontSize:10,color:C.indigo,background:"#EEF2FF",borderRadius:4,padding:"2px 7px",fontWeight:600}}>{t}</span>)}</div>}
                  {(session.subUseCases||[]).length>0&&<div style={{marginTop:4,display:"flex",flexWrap:"wrap",gap:4}}>{session.subUseCases.map(t=><span key={t} style={{fontSize:10,color:C.violet,background:"#F5F3FF",borderRadius:4,padding:"2px 7px",fontWeight:600}}>{t}</span>)}</div>}
                </div>
              )}
              {session.priorState&&(
                <div style={{fontSize:12,color:C.slate,marginBottom:12,paddingBottom:10,borderBottom:`1px solid ${C.border}`}}>
                  <span style={{color:C.muted}}>Starting point: </span>
                  {session.priorState==="netnew"?"Net-new analytics embedding":`Replacing ${session.priorState==="replacing"?(session.priorTool==="Other"?(session.priorToolOther||"another tool"):session.priorTool||"another tool"):""}`}
                </div>
              )}
              {QUESTIONS.map(q=>{
                const sel=asArr(answers[q.id]);
                const anyFlag=q.options.some(o=>sel.includes(o.v)&&o.flag);
                const label=answerLabel(q)||"—";
                return(
                  <div key={q.id} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:7,gap:8}}>
                    <span style={{fontSize:11,color:C.muted,fontWeight:600,flexShrink:0,paddingTop:1}}>Q{q.n}</span>
                    <span style={{fontSize:12,color:C.slate,fontWeight:600,textAlign:"right",lineHeight:1.3}}>{label}{anyFlag&&<span style={{color:"#EF4444"}}> ⚠</span>}</span>
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {/* SA confirmation — captures ground-truth label for accuracy tuning */}
              <div style={{background:"white",border:`1px solid ${C.border}`,borderRadius:14,padding:"18px 20px"}}>
                <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"1px",marginBottom:4}}>SOLUTIONS-ARCHITECT CONFIRMATION</div>
                <p style={{fontSize:12,color:C.muted,lineHeight:1.5,margin:"0 0 12px"}}>Recommended base: <strong style={{color:RECIPES[rec.base].color}}>{RECIPES[rec.base].code} · {RECIPES[rec.base].name}</strong>. Confirm or correct it — this is captured as ground-truth data to improve the tool's accuracy.</p>
                <label style={{fontSize:12,fontWeight:600,color:C.slate,display:"block",marginBottom:6}}>Confirmed base recipe</label>
                <select value={session.confirmedBase} onChange={e=>setSession(s=>({...s,confirmedBase:e.target.value}))}
                  style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1.5px solid ${C.border}`,fontSize:13,color:C.navy,background:"white",marginBottom:12,fontFamily:"inherit"}}>
                  <option value="">✓ Matches recommendation ({RECIPES[rec.base].code} {RECIPES[rec.base].name})</option>
                  {BASE_RECIPES.map(k=>(
                    <option key={k} value={k}>{RECIPES[k].code} · {RECIPES[k].name}{k===rec.base?" (recommended)":""}</option>
                  ))}
                </select>
                <label style={{fontSize:12,fontWeight:600,color:C.slate,display:"block",marginBottom:6}}>SA notes (optional)</label>
                <textarea value={session.saNotes} onChange={e=>setSession(s=>({...s,saNotes:e.target.value}))}
                  placeholder="Why the correction, edge cases, or context for the field record."
                  style={{width:"100%",minHeight:60,padding:"10px 12px",borderRadius:8,border:`1.5px solid ${C.border}`,fontSize:13,color:C.navy,outline:"none",resize:"vertical",lineHeight:1.5,fontFamily:"inherit"}}/>
                {session.confirmedBase&&session.confirmedBase!==rec.base&&(
                  <div style={{fontSize:11.5,color:"#92400E",background:"#FFFBEB",border:`1px solid ${C.amber}55`,borderRadius:6,padding:"8px 10px",marginTop:8,lineHeight:1.5}}>Override noted: <strong>{RECIPES[session.confirmedBase].code} {RECIPES[session.confirmedBase].name}</strong> instead of the recommended {RECIPES[rec.base].code}. Consider adding this profile to the validation harness.</div>
                )}
              </div>
              <div style={{background:"white",border:`1px solid ${C.border}`,borderRadius:14,padding:"18px 20px",flex:1}}>
                <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:"1px",marginBottom:8}}>NEXT STEP</div>
                <p style={{fontSize:13,color:C.slate,lineHeight:1.6,margin:"0 0 12px"}}>Saving appends this session — answers, recommendation, and your confirmation — as one row to the combined tracker file.</p>
                <button onClick={saveToSheet} disabled={saving||saveStatus==="success"} style={{width:"100%",background:saveStatus==="success"?"#ECFDF5":saving?"#F1F5F9":"linear-gradient(135deg,#6366F1,#8B5CF6)",color:saveStatus==="success"?C.green:saving?C.muted:"white",border:saveStatus==="success"?`2px solid ${C.green}`:"none",borderRadius:8,padding:"11px",fontSize:13,fontWeight:700,cursor:saving||saveStatus==="success"?"not-allowed":"pointer",marginBottom:8}}>
                  {saving?"Saving…":saveStatus==="success"?"✓ Saved to combined tracker":"📊 Save to discovery tracker"}
                </button>
                {saveStatus==="error"&&<div style={{fontSize:12,color:"#DC2626",background:"#FEF2F2",borderRadius:6,padding:"8px 10px",lineHeight:1.5}}>Could not save. Make sure you opened this through the local server (python3 server.py), not as a file:// page.</div>}
                <button onClick={reset} style={{width:"100%",background:"white",color:C.muted,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"10px",fontSize:13,fontWeight:600,cursor:"pointer"}}>← Start a new discovery session</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }
  return null;
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
